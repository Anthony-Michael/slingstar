<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Slingstar</title>
<meta name="description" content="Hold to swing, let go to fly. Climb as high as you can before the collapse catches you.">
<meta name="theme-color" content="#05040f">
<meta property="og:type" content="website">
<meta property="og:title" content="Slingstar">
<meta property="og:description" content="Hold to swing, let go to fly. One input, one climb, one collapse rising behind you.">
<meta name="twitter:card" content="summary">
<!-- Favicon is an inline SVG data URI: a tethered star, drawn rather than
     downloaded, so the game still ships as zero image files. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305040f'/%3E%3Ccircle cx='26' cy='26' r='11' fill='%23ffe9b0'/%3E%3Ccircle cx='26' cy='26' r='16' fill='none' stroke='%23ffc94d' stroke-width='3'/%3E%3Cline x1='26' y1='26' x2='45' y2='45' stroke='%23fff6e0' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='46' cy='46' r='6' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
  /* System fonts only — nothing to download, so the game is playable instantly. */
  :root {
    --ink: #fff6e0;
    --dim: rgba(255, 246, 224, 0.55);
    --gold: #ffc94d;
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05040f;
    color: var(--ink);
    overscroll-behavior: none;
  }

  #game {
    display: block;
    width: 100%;
    height: 100%;
    /* Stops a hold from becoming a scroll or a double-tap zoom on mobile. */
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }

  /* The HUD is DOM rather than canvas: crisp text at any DPR, and it costs
     nothing to redraw. Pointer events pass straight through to the canvas. */
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    padding: max(14px, env(safe-area-inset-top)) 16px 16px;
  }

  #top { display: flex; align-items: baseline; gap: 12px; }

  #height {
    font-size: clamp(30px, 8vw, 44px);
    font-weight: 800;
    letter-spacing: -0.02em;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
    font-variant-numeric: tabular-nums;
  }

  #best {
    font-size: clamp(11px, 3vw, 13px);
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--dim);
  }

  /* Wind-up meter: the one piece of feedback that teaches the whole game —
     you can see the launch you are charging. */
  #meter {
    margin-top: 8px;
    width: min(190px, 44vw);
    height: 5px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.12);
    overflow: hidden;
  }

  #meter-fill {
    width: 100%;
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--gold), #ff7a59);
    transform: scaleX(0);
    transform-origin: left;
  }

  #mute {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    right: 16px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.08);
    color: var(--dim);
    font-size: 17px;
    line-height: 1;
    pointer-events: auto;
    cursor: pointer;
  }

  /* Sits low, clear of the stars above the player — the prompt should never
     hide the thing it is telling you to aim at. */
  #overlay {
    margin: auto auto max(9vh, 60px);
    text-align: center;
    transition: opacity 0.25s ease;
  }

  #overlay[data-show="playing"] { opacity: 0; }

  #overlay-title {
    font-size: clamp(40px, 13vw, 68px);
    font-weight: 800;
    letter-spacing: 0.02em;
    text-shadow: 0 4px 30px rgba(0, 0, 0, 0.7);
  }

  #overlay[data-show="ready"] #overlay-title { animation: pulse 1.5s ease-in-out infinite; }

  #overlay-detail {
    margin-top: 6px;
    font-size: clamp(12px, 3.4vw, 15px);
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--dim);
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.55; transform: scale(0.97); }
    50% { opacity: 1; transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    #overlay[data-show="ready"] #overlay-title { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="top">
      <div id="height">0m</div>
      <div id="best"></div>
    </div>
    <div id="meter"><div id="meter-fill"></div></div>
    <button id="mute" type="button" aria-label="Toggle sound">♪</button>
    <div id="overlay" data-show="ready">
      <div id="overlay-title">HOLD</div>
      <div id="overlay-detail">hold to wind up</div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
